<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merrill 1903 · Philippine Plant Names</title>
<meta name="description" content="A searchable edition of Elmer D. Merrill's 1903 Dictionary of the Plant Names of the Philippine Islands.">
<!-- Absolute, and the same on every copy: this says which address is the real
     one when the site is mirrored to another host. -->
<link rel="canonical" href="https://pranada0203.github.io/Plant-Names-of-the-Philippine-Islands/">
<meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13120f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Plant Names">
<!-- The text face, ahead of the stylesheet that asks for it. Without these the
     browser cannot discover a font until it has parsed the CSS, matched a rule
     and laid out the text, which is three round trips of fallback type on the
     screen. 69 KB once, and the roman is variable, so those two files cover
     every weight the page uses; the worker serves them from cache afterwards.
     `crossorigin` is required even same-origin -- fonts are fetched in CORS
     mode, and a preload without it is fetched a second time and wasted. -->
<link rel="preload" href="assets/fonts/sourceserif4-roman.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sourceserif4-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <header class="masthead">
    <h1>Plant Names of the Philippine Islands<span>Merrill · 1903</span></h1>
    <div class="spacer"></div>
    <button class="icon-btn" id="browse" type="button">Browse</button>
    <button class="icon-btn" id="about" type="button">About</button>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle colour theme">Theme</button>
  </header>

  <div class="body">
    <section class="pane" aria-label="Search and results">
      <div class="searchbar">
        <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="Search a native or scientific name…" aria-label="Search">
      </div>
      <div class="filters">
        <select id="dialect" aria-label="Filter by language"><option value="">All languages</option></select>
        <select id="family" aria-label="Filter by plant family"><option value="">All families</option></select>
        <select id="letter" aria-label="Filter by initial letter"><option value="">A–Z</option></select>
        <label class="toggle"><input type="checkbox" id="confident"> Hide doubtful readings</label>
        <div class="count" id="count"></div>
      </div>
      <ul class="results" id="results"></ul>
    </section>

    <main class="detail" id="detail" tabindex="-1">
      <button class="icon-btn back" id="back" type="button">← Results</button>
      <div class="detail-inner" id="detail-inner"></div>
    </main>
  </div>

  <div class="update-bar" id="update" hidden>
    <span>A new version of the dictionary is ready.</span>
    <button type="button" id="update-reload">Reload</button>
    <button type="button" id="update-dismiss" aria-label="Keep the current version">Later</button>
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
