<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merrill 1903 · Philippine Plant Names</title>
<meta name="description" content="A searchable edition of Elmer D. Merrill's 1903 Dictionary of the Plant Names of the Philippine Islands.">
<!-- Absolute, and the same on every copy: this says which address is the real
     one when the site is mirrored to another host. -->
<link rel="canonical" href="https://pranada0203.github.io/Plant-Names-of-the-Philippine-Islands/">
<!-- The browser chrome sits against the masthead, so it takes the masthead's
     indigo rather than the paper behind the page. -->
<meta name="theme-color" content="#24395c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b2c47" media="(prefers-color-scheme: dark)">
<!-- Last, and with no media query: the first MATCHING tag wins, so the two
     above still decide it in any browser that understands `media`. This one is
     for the browsers that skip a tag whose media attribute they cannot parse,
     and would otherwise tint their chrome with nothing at all. -->
<meta name="theme-color" content="#24395c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Plant Names">
<!-- Added to the home screen, iOS runs the app standalone and reserves the
     status bar for itself, painting it with the manifest's background_color --
     which is why the top of the screen was a band of paper above the masthead.
     `black-translucent` gives the page that space instead: the viewport becomes
     the whole screen, `env(safe-area-inset-top)` starts reporting the real
     inset, and the masthead's padding fills it with dye. The status bar's own
     text is drawn white, which is what the indigo underneath wants.
     The style tag is only honoured when the capable tag is present. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The text face, ahead of the stylesheet that asks for it. Without these the
     browser cannot discover a font until it has parsed the CSS, matched a rule
     and laid out the text, which is three round trips of fallback type on the
     screen. 69 KB once, and the roman is variable, so those two files cover
     every weight the page uses; the worker serves them from cache afterwards.
     `crossorigin` is required even same-origin -- fonts are fetched in CORS
     mode, and a preload without it is fetched a second time and wasted. -->
<link rel="preload" href="assets/fonts/sourceserif4-roman.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sourceserif4-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <header class="masthead">
    <h1>Plant Names of the Philippine Islands<span>Merrill · 1903</span></h1>
    <div class="spacer"></div>
    <!-- Each control carries both a word and a mark. The word is the label on a
         wide screen; on a phone it is hidden visually and the mark stands in,
         because three words of chrome beside a four-word title is more than the
         line can hold. `aria-label` is on the button either way, so the
         accessible name never depends on which of the two is showing. -->
    <button class="icon-btn" id="browse" type="button" aria-label="Browse the dictionary">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 6.6C10.4 5.1 8.4 4.6 4 4.6v12.8c4.4 0 6.4.5 8 2 1.6-1.5 3.6-2 8-2V4.6c-4.4 0-6.4.5-8 2z"/>
        <path d="M12 6.6v12.8"/>
      </svg>
      <span>Browse</span>
    </button>
    <button class="icon-btn" id="about" type="button" aria-label="About this edition">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.4"/>
        <path d="M12 11.2v5.2"/>
        <circle cx="12" cy="7.9" r="1" fill="currentColor" stroke="none"/>
      </svg>
      <span>About</span>
    </button>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle colour theme">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.4"/>
        <path d="M12 3.6a8.4 8.4 0 0 0 0 16.8z" fill="currentColor" stroke="none"/>
      </svg>
      <span>Theme</span>
    </button>
  </header>

  <div class="body">
    <section class="pane" aria-label="Search and results">
      <div class="searchbar">
        <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="Search a native or scientific name…" aria-label="Search">
      </div>
      <div class="filters">
        <select id="dialect" aria-label="Filter by language"><option value="">All languages</option></select>
        <select id="family" aria-label="Filter by plant family"><option value="">All families</option></select>
        <select id="letter" aria-label="Filter by initial letter"><option value="">A–Z</option></select>
        <label class="toggle"><input type="checkbox" id="confident"> Hide doubtful readings</label>
        <div class="count" id="count"></div>
      </div>
      <ul class="results" id="results"></ul>
    </section>

    <main class="detail" id="detail" tabindex="-1">
      <button class="icon-btn back" id="back" type="button">← Results</button>
      <div class="detail-inner" id="detail-inner"></div>
    </main>
  </div>

  <div class="update-bar" id="update" hidden>
    <span>A new version of the dictionary is ready.</span>
    <button type="button" id="update-reload">Reload</button>
    <button type="button" id="update-dismiss" aria-label="Keep the current version">Later</button>
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
